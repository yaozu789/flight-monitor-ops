# Cheap Flight Monitor — watch configuration (Phase 1: japan + nyc)
# Phase 2 adds: hkg, shanghai, beijing, la, san-diego

defaults:
  origins: [SFO, OAK, SJC]
  cabin: economy
  max_stops: 1
  trip_length_days: [5, 14]
  window_months: [3, 9]        # departure window, months from today
  relative_threshold: 0.35      # Phase 2: alert at >=35% below rolling median
  cooldown_hours: 24            # don't re-alert same itinerary within 24h
  currency: USD
  run_every_minutes: 30         # must match the Muse schedule; drives budget pacing
  alert_mode: collect           # a new watch only collects until switched on
  daily_ceiling: 225            # Google requests/day; the budget step (150 -> 225 -> 300)

# Named departure windows (redesign, docs: Redesign_spec.md). A watch with
# `windows:` lists its exact trip lengths in `nights:` and ignores the
# window_months / trip_length_days defaults above. Each window is
# `days: [lo, hi]` or `months: [lo, hi]` from today, plus `refresh_hours`,
# and `step_days` (every N days) or `weekdays` (0=Mon .. 4=Fri); with
# neither, about 27 anchors are spread across the window.
# `return_weekday` (with `weekdays`) fixes the return day instead of
# `nights`.
#
# alert_mode: `collect` stores prices only -- no scoring, verification,
# bursts or alerts, and queued alerts/bursts are retired on entry. While
# every watch collects, the verify reserve and alert-path budget caps are
# released to sentinels. `relative` alerts on a fare <= 70% of its route's
# 28-day median once that route is armed (50 daily lows on 14 days; see
# `run.py coverage` -> relative_routes); unarmed routes stay silent. `cap` is
# the legacy absolute-cap rule. Caps are kept for the schema but unused
# outside cap mode; `max_alert_usd` optionally caps a relative threshold.
#
# Trip-length exploration (off unless set): explore_nights: [14, 21] adds
# checks of other stays on the window's dates, run only when no sentinel is
# due, at most explore_per_day attempts/day (cheap 2-attempt checks). Turn
# on after the 300/day stage is stable.
# Phase 2 weekend groups (LA, SD): leave Fri (any time) or Sat morning,
# return Sun. depart_hours limits only the OUTBOUND flight on that weekday
# (hours inclusive: "5-11" = 05:00-11:59, i.e. before noon):
#   windows: {near: {days: [7, 42], weekdays: [4, 5], return_weekday: 6,
#                    depart_hours: {5: "5-11"}, refresh_hours: 48}}
watches:
  - id: japan
    destinations: [NRT, HND, KIX]
    absolute_cap_usd: 500
    alert_mode: relative         # alerts start by themselves as routes arm
    nights: [28]                 # about a month
    windows:
      near: {days: [7, 42], step_days: 2, refresh_hours: 72}
      far: {months: [3, 9], refresh_hours: 120}
  - id: nyc
    destinations: [EWR, JFK, LGA]
    absolute_cap_usd: 250
    alert_mode: relative         # alerts start by themselves as routes arm
    nights: [7, 14]              # one or two weeks
    windows:
      near: {days: [7, 42], step_days: 2, refresh_hours: 72}

  # ---- Phase 2. Each budget step (150 -> 225 -> 300/day) switches some on,
  # after `run.py coverage` passes and Yaozu approves. Caps are unused outside
  # cap mode (kept for the schema).
  # 225/day step (2026-10-03): la, sd, hkg ON. 300/day step: shanghai, beijing.
  - id: la
    destinations: [LAX, BUR, LGB, SNA, ONT]
    absolute_cap_usd: 120
    alert_mode: relative         # alerts start by themselves as routes arm
    windows:                     # weekend: Fri any time or Sat morning, back Sun
      near: {days: [7, 42], weekdays: [4, 5], return_weekday: 6,
             depart_hours: {5: "5-11"}, refresh_hours: 72}
  - id: sd
    destinations: [SAN]
    absolute_cap_usd: 150
    alert_mode: relative         # alerts start by themselves as routes arm
    windows:
      near: {days: [7, 42], weekdays: [4, 5], return_weekday: 6,
             depart_hours: {5: "5-11"}, refresh_hours: 72}
  - id: hkg
    destinations: [HKG]
    absolute_cap_usd: 500
    alert_mode: relative         # alerts start by themselves as routes arm
    nights: [28]
    windows:
      near: {days: [7, 42], step_days: 2, refresh_hours: 72}
      far: {months: [3, 9], refresh_hours: 120}
  - id: shanghai
    enabled: false
    destinations: [PVG, SHA]
    absolute_cap_usd: 550
    alert_mode: collect
    nights: [28]
    windows:
      near: {days: [7, 42], step_days: 2, refresh_hours: 72}
      far: {months: [3, 9], refresh_hours: 120}
  - id: beijing
    enabled: false
    destinations: [PEK, PKX]
    absolute_cap_usd: 550
    alert_mode: collect
    nights: [28]
    windows:
      near: {days: [7, 42], step_days: 2, refresh_hours: 72}
      far: {months: [3, 9], refresh_hours: 120}
